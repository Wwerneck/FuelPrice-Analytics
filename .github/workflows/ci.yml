name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-pipeline.txt
      - run: python -m compileall -q config src dashboard airflow
      - run: python -m pytest

  dashboard-cloud-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Execute Streamlit entrypoint
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for entrypoint in ("dashboard/app.py", "airflow/dags/fuelprice_pipeline_dag.py"):
              app = AppTest.from_file(entrypoint, default_timeout=60)
              app.run()
              assert not app.exception, (entrypoint, [item.value for item in app.exception])
          PY
