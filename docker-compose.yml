x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
    DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/fuelprice_db
    LOAD_DATABASE: "true"
    PYTHONPATH: /opt/airflow/project
  volumes:
    - ./:/opt/airflow/project
    - ./airflow/dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airflow
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: bash -c "pip install --no-cache-dir -r /opt/airflow/project/requirements-pipeline.txt && airflow db migrate && airflow users create --username airflow --password airflow --firstname Fuel --lastname Price --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    command: bash -c "pip install --no-cache-dir -r /opt/airflow/project/requirements-pipeline.txt && airflow webserver"
    ports: ["8080:8080"]
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: bash -c "pip install --no-cache-dir -r /opt/airflow/project/requirements-pipeline.txt && airflow scheduler"
    restart: unless-stopped

volumes:
  postgres_data:
